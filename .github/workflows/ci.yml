name: ci
on:
  push:
    branches-ignore: ["entire/**"]
    paths-ignore:
      - '.agents/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '.agents/**'
      - '.claude/**'

jobs:
  manifests:   # kit:manifests:start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install Claude Code CLI (for plugin validate)
        run: npm install -g @anthropic-ai/claude-code
      - name: Manifests, versions, install policy, kit copies, rendered blocks
        run: python3 scripts/kit/check-manifests.py --validate
      - name: Secret scan (tree and history)
        run: python3 scripts/kit/secret-scan.py --tree --history
      - name: Local markdown links
        run: python3 scripts/kit/check-links.py
  # kit:manifests:end

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable          # Swift 6 toolchain (runner default is older)
      - name: Install lint deps (so the audit engine's tier-2 ast-grep rules are actually exercised)
        run: brew install ast-grep ripgrep jq
      - name: Install plugin build dependencies
        run: npm ci

      - name: Assemble and test Claude + Codex plugin packages
        run: |
          npm run test:plugins
          npx tsc -p packages/codex-plugin/mcp/tsconfig.json
          python3 scripts/validate-codex-plugin.py dist/codex-swiftui-plugin
          npm pack ./dist/claude-swiftui-plugin --dry-run --json > /tmp/claude-pack.json
          npm pack ./dist/codex-swiftui-plugin --dry-run --json > /tmp/codex-pack.json
          python3 scripts/check-package-limits.py /tmp/claude-pack.json /tmp/codex-pack.json

      - name: Install checked-in Codex marketplace in isolation
        run: npm run test:codex-install

      - name: Build + scanner regression + CLI smoke
        run: make test
      - name: CLI doctor (catalog loads)
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$(swiftui-scan/.build/release/swiftui-ctx --version)" = "$VERSION"
          SWIFTUI_CTX_CATALOG="$PWD/catalog" swiftui-scan/.build/release/swiftui-ctx doctor --json \
            | python3 -c 'import json,sys; expected=open("VERSION").read().strip(); data=json.load(sys.stdin); assert data["result"]["version"] == expected'

      - name: CLI subcommand smokes (each must exit 0 / ok:true)
        run: |
          set -euo pipefail
          B=swiftui-scan/.build/release/swiftui-ctx
          export SWIFTUI_CTX_CATALOG="$PWD/catalog"
          ok() { echo "smoke: $*"; "$B" "$@" --json | python3 -c 'import sys,json; assert json.load(sys.stdin)["ok"], "ok:false"'; }
          ok deprecated
          ok search drag
          ok examples MenuBarExtra
          ok recipe menubar-app
          ok stats
          ok doctor
          ok conformances View
          ok valueBuilders ease

      - name: Audit lint engine self-test (rule-rot guard; ast-grep present → tier-2 exercised)
        run: make audit-selftest
      - name: Orchestrator steering smoke
        run: python3 scripts/audit-scan.py tests/fixtures --json /tmp/scan.json && python3 -c 'import json;d=json.load(open("/tmp/scan.json"));assert d["relevant_skills"],"no relevant skills";print(len(d["relevant_skills"]),"relevant")'

      - name: deprecated-names.txt is in sync with the catalog
        run: |
          python3 scripts/gen_deprecated_list.py
          git diff --exit-code hooks/deprecated-names.txt \
            || (echo "::error::hooks/deprecated-names.txt is stale — run scripts/gen_deprecated_list.py and commit" && exit 1)

      - name: Validate every skill against the Agent Skills spec (dependency-free, fail-fast)
        run: make validate
