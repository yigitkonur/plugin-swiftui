name: binary
# On a version tag, build a universal macOS `swiftui-ctx` and attach it to the GitHub Release.
# The bundled wrapper (scripts/swiftui-ctx) downloads this asset on first run — so plugin users need no toolchain.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Released version tag (vX.Y.Z)"
        required: true
        type: string

concurrency:
  group: binary-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the release tag, not the triggering pre-release SHA
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then
            # The release commit is a child of the CI-tested SHA, not that SHA itself.
            for candidate in $(git tag --list 'v*' --sort=-version:refname); do
              commit=$(git rev-parse "$candidate^{commit}")
              if [ "$(git rev-parse "$commit^")" = "$RELEASE_HEAD" ]; then
                TAG="$candidate"
                break
              fi
            done
            if [ -z "$TAG" ]; then
              echo "No release was published for $RELEASE_HEAD; nothing to build."
              exit 0
            fi
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --json tagName --jq .tagName
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.release.outputs.tag != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.release.outputs.tag != ''
        with:
          xcode-version: latest-stable          # Swift 6 toolchain (runner default is older)
      - name: Verify tag and assemble plugin packages
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "${RELEASE_TAG}" = "v${VERSION}"
          npm ci
          npm run test:plugins
          npx tsc -p packages/codex-plugin/mcp/tsconfig.json
      - name: Build universal binary (arm64 + x86_64)
        if: steps.release.outputs.tag != ''
        run: |
          cd swiftui-scan
          swift build -c release --product swiftui-ctx --arch arm64 --arch x86_64
          cp .build/apple/Products/Release/swiftui-ctx "$GITHUB_WORKSPACE/swiftui-ctx"
          file "$GITHUB_WORKSPACE/swiftui-ctx"
      - name: Verify it runs (version + doctor + subcommand smokes)
        if: steps.release.outputs.tag != ''
        run: |
          set -euo pipefail
          chmod +x swiftui-ctx
          export SWIFTUI_CTX_CATALOG="$GITHUB_WORKSPACE/catalog"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$(./swiftui-ctx --version)" = "$VERSION"
          ok() { echo "smoke: $*"; ./swiftui-ctx "$@" --json | python3 -c 'import sys,json; assert json.load(sys.stdin)["ok"], "ok:false"'; }
          ok doctor
          ok lookup MenuBarExtra
          ok deprecated
          ok search drag
          ok recipe menubar-app
          ok conformances View
          ok valueBuilders ease
      - name: Attach missing binary to the existing release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq swiftui-ctx; then
            echo "swiftui-ctx already attached to $RELEASE_TAG"
          else
            gh release upload "$RELEASE_TAG" swiftui-ctx
          fi
      - name: Publish optional Claude and Codex npm mirrors
        if: steps.release.outputs.tag != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is not configured; skipping optional npm mirrors."
            exit 0
          fi
          npm publish ./dist/claude-swiftui-plugin --access public --provenance
          npm publish ./dist/codex-swiftui-plugin --access public --provenance
